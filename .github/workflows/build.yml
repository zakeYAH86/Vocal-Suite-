name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DVS_COPY_AFTER_BUILD=OFF

      - name: Build and package
        run: cmake --build build --config Release --target package --parallel 2

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: VocalSuite-${{ runner.os }}
          path: build/VocalSuite-*.zip
          if-no-files-found: error
